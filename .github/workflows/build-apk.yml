name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Merge resources
        run: ./gradlew mergeDebugResources --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Inspect merged values.xml around line 2176
        run: |
          echo "=== Lines 2170-2185 of merged values.xml ==="
          sed -n '2170,2185p' app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml
          echo "=== Total lines ==="
          wc -l app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml
          echo "=== Search for empty ? references ==="
          grep -n 'name=""' app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml || true
          grep -n '>"?<' app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml || true
          grep -n '?>$' app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml | head -5 || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
