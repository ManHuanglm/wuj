name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Merge resources
        run: ./gradlew mergeDebugResources --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Search for problematic ? references
        run: |
          FILE="app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml"
          echo "=== All ? that are not ?attr/ or ?android: or ?xml ==="
          grep -n '?' "$FILE" | grep -v '?attr/' | grep -v '?android:' | grep -v '<?xml' | grep -v '<\?' | head -30
          echo "=== Items with ? value ==="
          grep -n '<item.*>?' "$FILE" | grep -v '?attr/' | grep -v '?android:' | head -20
          echo "=== Search for bare ? references ==="
          grep -n '>?</' "$FILE" | head -20
          echo "=== Search for ? in style items ==="
          grep -n '<item name=' "$FILE" | grep '?' | grep -v '?attr/' | grep -v '?android:' | head -20

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
