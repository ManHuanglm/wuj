name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Merge resources
        run: ./gradlew mergeDebugResources --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Find and inspect merged values.xml
        run: |
          echo "=== Finding values.xml files ==="
          find app/build -name "values.xml" -type f 2>/dev/null
          echo "=== Searching for attr/? ==="
          find app/build -name "values.xml" -type f -exec grep -n "attr/?" {} \; 2>/dev/null || true
          echo "=== Showing context ==="
          find app/build -name "values.xml" -type f -exec grep -B5 -A5 "attr/?" {} \; 2>/dev/null || true
          echo "=== Searching for '?' as attribute name ==="
          find app/build -name "values.xml" -type f -exec grep -n 'name="?"' {} \; 2>/dev/null || true
          echo "=== Searching for ?attr/ references ==="
          find app/build -name "values.xml" -type f -exec grep -n '?attr/' {} \; 2>/dev/null | head -20 || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain -Pandroid.overridePathCheck=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wuji-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
